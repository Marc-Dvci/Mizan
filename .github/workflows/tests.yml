# The guard suite, on every push. The suite is the part of this repository that says
# whether a result can be believed, so it runs where a reader can see it run.
#
# Windows and Python 3.12 because that is the environment `requirements.lock.txt`
# records the published numbers as having been produced in, and the suite asserts that
# the installed versions are the pinned ones. Installing anything but the lock fails
# that guard, which is the guard doing its job.
#
# The tests that need a MODFLOW run skip on a fresh clone: `runs/` is not in the
# repository. What runs here is the deterministic part, the estimator algebra, the
# observation operators, the localisation, the leakage guards and the environment and
# licence pins.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  guards:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Guard suite
        run: python -m pytest tests -q
